<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>رغد المرشدي — نظم المعلومات الإدارية</title>
    <meta
      name="description"
      content="نظم المعلومات الإدارية:تحليل البيانات، وتحليل النظم، وتحسين العمليات باستخدام Power BI وSQL."
    />

    <!-- Set language + direction before first paint to avoid a layout flash -->
    <script>
      (function () {
        var lang
        try { lang = localStorage.getItem('lang') } catch (e) {}
        if (lang !== 'ar' && lang !== 'en') {
          var nav = (navigator.language || '').toLowerCase()
          lang = nav && nav.indexOf('ar') !== 0 ? 'en' : 'ar'
        }
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400..700&family=Readex+Pro:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
